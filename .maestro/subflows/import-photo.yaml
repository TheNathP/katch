appId: ${APP_ID}
---
- tapOn: "^Choisir (une photo )?dans ma galerie$"
- runFlow:
    when:
      platform: Android
    commands:
      - tapOn:
          id: '.*:id/(icon_thumbnail|thumbnail)'
          index: 0
          optional: true
      - tapOn:
          text: "^Photo taken on .+$"
          index: 0
          optional: true
- runFlow:
    when:
      platform: iOS
    commands:
      - tapOn:
          id: "PXGGridLayout-Info"
          index: 0
          optional: true
      - tapOn:
          text: "^Photo, .+$"
          index: 0
          optional: true
- extendedWaitUntil:
    visible:
      id: "challenge-photo-preview-ready"
    timeout: 15000
- assertVisible: "Photo à valider"
- assertNotVisible: "Photo introuvable"
